# Used as a template: the nginx image fills ${NGINX_LOCAL_RESOLVERS} from
# /etc/resolv.conf at start (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1, see Dockerfile).
# nginx's own variables ($uri, $1, $api_upstream ...) are left alone, because the
# template step replaces only names that are set as environment variables.

# ---- /api: the same allowlist as the Kubernetes gateway (k8s/gateway/routes.yaml) ----
# The frontend calls relative paths like /api/store/user/login. In Kubernetes
# the gateway answers /api/* before a request ever reaches this pod. In compose
# there is no gateway, so this nginx forwards them instead.
#
# Only the method + path pairs the frontend calls get an upstream; everything
# else maps to "" and gets 404 (see `location /api/` below). bank and tracking
# have no line: the frontend calls neither. Ids are [0-9]+ for the same reason
# as in routes.yaml. $uri is the decoded, normalised path, the one locations
# are matched on too. A new frontend call needs a line here and in routes.yaml;
# ./k8s/scripts/check-entry.ps1 runs one list of requests against both entries.
map_hash_bucket_size 128; # the default 64 bytes is shorter than some keys below
map "$request_method $uri" $api_upstream {
    default "";
    # store (/api/store/x -> store /api/x)
    "POST /api/store/user"                                            store:8082;
    "POST /api/store/user/login"                                      store:8082;
    "POST /api/store/user/activate"                                   store:8082;
    "POST /api/store/user/forgot-password"                            store:8082;
    "POST /api/store/user/reset-password"                             store:8082;
    "GET /api/store/products"                                         store:8082;
    "GET /api/store/products/available"                               store:8082;
    "~^GET /api/store/products/[0-9]+$"                               store:8082;
    "POST /api/store/store/orders/create-with-payment"                store:8082;
    "~^GET /api/store/store/orders/user/[0-9]+/with-payment$"         store:8082;
    "~^GET /api/store/store/orders/[0-9]+/with-payment$"              store:8082;
    "~^POST /api/store/store/orders/[0-9]+/(cancel|retry-payment)$"   store:8082;
    "~^POST /api/store/payments/[0-9]+/refund$"                       store:8082;
    # store, admin dashboard
    "GET /api/store/orders"                                           store:8082;
    "GET /api/store/warehouses"                                       store:8082;
    "GET /api/store/warehouses/audit-logs/out-transactions"           store:8082;
    # delivery (/api/delivery/x -> delivery /api/x)
    "GET /api/delivery/deliveries/me"                                 delivery:8081;
    "~^GET /api/delivery/deliveries/[0-9]+$"                          delivery:8081;
    "~^POST /api/delivery/deliveries/[0-9]+/cancel$"                  delivery:8081;
    # delivery, admin dashboard
    "GET /api/delivery/admin/dlq/delivery"                            delivery:8081;
    "~^POST /api/delivery/admin/dlq/delivery/[0-9]+/(resolve|requeue)$" delivery:8081;
    # email (path unchanged)
    "POST /api/email/send-verification"                               email:8083;
    "POST /api/email/verify-code"                                     email:8083;
}

server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;

    # React Router handles paths like /orders in the browser. When the page is
    # reloaded on such a path there is no file for it, so serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached, or users keep old bundle names after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The upstream is a variable on purpose: nginx then looks the name up per
    # request instead of at start, so it starts even when a backend is not up yet.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    location /api/ {
        # Read the map before the rewrite below changes $uri.
        set $upstream $api_upstream;
        if ($upstream = "") { return 404; }
        rewrite ^/api/(store|delivery)/(.*)$ /api/$2 break;
        proxy_pass http://$upstream;
    }
    # Not part of the API: 404, as the gateway does. Without these they would
    # fall to "/" and get index.html with 200, which hides the mistake.
    location /actuator { return 404; }
    location /internal { return 404; }

    # Same body as the gateway's 404, so both entries answer alike.
    error_page 404 = @not_found;
    location @not_found {
        default_type text/plain;
        return 404 'not found';
    }
}
