# Used as a template: the nginx image fills ${NGINX_LOCAL_RESOLVERS} from
# /etc/resolv.conf at start (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1, see Dockerfile).
# nginx's own variables ($uri, $1, $store ...) are left alone, because the
# template step replaces only names that are set as environment variables.
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;

    # React Router handles paths like /orders in the browser. When the page is
    # reloaded on such a path there is no file for it, so serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached, or users keep old bundle names after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- /api: the same routes as the Kubernetes gateway (k8s/gateway/routes.yaml) ----
    # The frontend calls relative paths like /api/store/user/login. In Kubernetes
    # the gateway answers /api/* before a request ever reaches this pod. In
    # compose there is no gateway, so this nginx forwards them instead.
    #
    # The upstreams are variables on purpose: nginx then looks the names up per
    # request instead of at start, so it starts even when a backend is not up yet.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $store    store:8082;
    set $bank     bank:8084;
    set $delivery delivery:8081;
    set $email    email:8083;
    set $tracking tracking:8085;

    # /api/store/x -> store /api/x ; /api/delivery/x -> delivery /api/x
    location /api/store/ {
        rewrite ^/api/store/(.*)$ /api/$1 break;
        proxy_pass http://$store;
    }
    location /api/delivery/ {
        rewrite ^/api/delivery/(.*)$ /api/$1 break;
        proxy_pass http://$delivery;
    }
    # These services already use the prefix in their own paths.
    location /api/email/ {
        proxy_pass http://$email;
    }
    location /api/tracking/ {
        proxy_pass http://$tracking;
    }
    # bank: only the two reads the frontend uses. Transfer and refund have no
    # authentication, and only store may call them (design figure 2).
    location ~ ^/api/bank/account/(me|[^/]+/balance)$ {
        limit_except GET { deny all; }
        proxy_pass http://$bank;
    }
    # Every other /api path (e.g. POST /api/bank/transfer), and the internal
    # prefixes: 404, as the gateway does. Without this they would fall to "/"
    # and get index.html with 200, which hides the mistake.
    location /api/      { return 404; }
    # delivery -> store status callback, no authentication: never from outside.
    location /api/store/delivery-webhook { return 404; }
    location /actuator  { return 404; }
    location /internal  { return 404; }
}
