spring.application.name=deliveryService
# Secrets come from env vars or a git-ignored backend/.env (see backend/.env.example)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]
# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/delivery_db
spring.datasource.username=${DELIVERY_DB_USERNAME:delivery_user}
spring.datasource.password=${DELIVERY_DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
server.port=8081

# Store Service URL (for token validation)
store.service.url=http://localhost:8082

# Email Service URL
email.service.url=http://localhost:8083

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Kafka (wave 2 config contract). compose sets SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092; bootRun on this machine uses 9094
spring.kafka.bootstrap-servers=localhost:9094
# Producer: idempotent, wait for the broker, and give up on a send within seconds so a publishing round
# never holds its advisory lock for minutes while Kafka is down (rule 3)
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
event-outbox.publisher.interval-ms=1000
