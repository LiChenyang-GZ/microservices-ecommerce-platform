plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.comp5348'
version = '0.0.1-SNAPSHOT'
description = 'bankService'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// /actuator/health for Docker and Kubernetes health checks
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.postgresql:postgresql'
	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	// bank.proto stubs (contracts) + gRPC server for store (ADR-10). Version matches contracts' grpcVersion.
	implementation project(':contracts')
	implementation 'io.grpc:grpc-netty-shaded:1.68.1'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Integration tests: a throwaway Postgres in Docker, never the local webuser database
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	// Wait until a transaction committed in the background (client gave up, bank kept going)
	testImplementation 'org.awaitility:awaitility'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}


