spring.application.name=bankService
# Secrets come from env vars or a git-ignored backend/.env (see backend/.env.example)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/bank_db
spring.datasource.username=${BANK_DB_USERNAME:bank_user}
spring.datasource.password=${BANK_DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Server Port
server.port=8084

# gRPC for store's transfer / refund calls (ADR-10, docs/wave2-config-contract.md)
bank.grpc.port=${BANK_GRPC_PORT:9090}

# Store Service URL (for token validation)
store.service.url=http://localhost:8082

# Logging
logging.level.com.comp5348.bank=DEBUG


