plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'comp5348'
version = '0.0.1-SNAPSHOT'
description = 'storeService'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// /actuator/health for Docker and Kubernetes health checks
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	// Wave 2: consume delivery-events, publish to the DLT (and order-events in 4b); events use the shared contracts
	implementation 'org.springframework.kafka:spring-kafka'
	implementation project(':contracts')
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
	implementation 'org.postgresql:postgresql'
	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Integration tests: a throwaway Postgres in Docker, never the local webuser database
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	// Fake bank over HTTP: timeouts, connection resets, scripted answers
	testImplementation 'org.wiremock:wiremock-standalone:3.9.1'
	// Architecture rule: only OutboxProcessor may move money
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
	testImplementation 'org.awaitility:awaitility'
	// Wave 2 A: a real Kafka in Docker (same image as compose); tests send and read events with the plain client
	testImplementation 'org.testcontainers:kafka'
	testImplementation 'org.apache.kafka:kafka-clients'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
