spring.application.name=storeService
# Secrets come from env vars or a git-ignored backend/.env (see backend/.env.example)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/store_db
spring.datasource.username=${STORE_DB_USERNAME:store_user}
spring.datasource.password=${STORE_DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Server Port
server.port=8082

# Store Service URL (for internal API calls)
store.service.url=http://localhost:8082

# Bank Service Configuration
bank.service.url=http://localhost:8084
bank.store.account=STORE_ACCOUNT_001
bank.customer.account=CUSTOMER_ACCOUNT_001

# Outbox Processor Configuration
outbox.processor.enabled=true
outbox.processor.max-retries=3

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Delivery Service Configuration
delivery.service.url=http://localhost:8081
delivery.notification.url=http://localhost:8082/api/delivery-webhook

# Logging
logging.level.comp5348.storeservice=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000