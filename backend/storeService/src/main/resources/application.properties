spring.application.name=storeService
# Secrets come from env vars or a git-ignored backend/.env (see backend/.env.example)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/store_db
spring.datasource.username=${STORE_DB_USERNAME:store_user}
spring.datasource.password=${STORE_DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Server Port
server.port=8082

# Store Service URL (for internal API calls)
store.service.url=http://localhost:8082

# Bank Service Configuration
bank.service.url=http://localhost:8084
bank.store.account=STORE_ACCOUNT_001
bank.customer.account=CUSTOMER_ACCOUNT_001

# Outbox Processor Configuration
outbox.processor.enabled=true
outbox.processor.max-retries=3

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Delivery Service Configuration
delivery.service.url=http://localhost:8081

# Kafka (wave 2 config contract). compose sets SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092; bootRun on this machine uses 9094
spring.kafka.bootstrap-servers=localhost:9094
# Consumer group from the contract. earliest: a group seen for the first time also reads events that were
# published before it started (otherwise Kafka's default "latest" would skip them)
spring.kafka.consumer.group-id=store
spring.kafka.consumer.auto-offset-reset=earliest
# Commit each record's offset right after its handler (and database transaction) finished
spring.kafka.listener.ack-mode=record
# One consumer thread per partition (3), so one stuck partition does not stop the other two
spring.kafka.listener.concurrency=3
# Producer (used for the DLT now, for order-events in 4b): idempotent, and fail a send within seconds
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# Logging
logging.level.comp5348.storeservice=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000