spring.application.name=emailService
# Secrets come from env vars or a git-ignored backend/.env (see backend/.env.example)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]
# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/webuser
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
server.port=8083

# Store Service URL (for token validation)
store.service.url=http://localhost:8082

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# Use manual acknowledgment mode to ensure messages are not lost
spring.rabbitmq.listener.simple.acknowledge-mode=manual


#JavaMail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true