spring.application.name=emailService
# Secrets come from env vars or a git-ignored backend/.env (see backend/.env.example)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]
# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/email_db
spring.datasource.username=${EMAIL_DB_USERNAME:email_user}
spring.datasource.password=${EMAIL_DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
server.port=8083

# Service token store must send on the password-reset endpoints (ADR-23). Spring does not bind
# EMAIL_SERVICE_TOKEN to email.service-token on its own (hyphen), so it is spelled out. Blank → email refuses to start.
email.service-token=${EMAIL_SERVICE_TOKEN:}

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# Use manual acknowledgment mode to ensure messages are not lost
spring.rabbitmq.listener.simple.acknowledge-mode=manual


#JavaMail
# Gmail by default (running from an IDE). compose and kind send to Mailpit instead, a fake SMTP server whose
# web page and API show every mail (A11: the scripts read the verification code there).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
# JavaMail waits forever by default; a wrong MAIL_PORT would hold the request (and the email_queue consumer)
# until the OS gives up. 5 seconds, like store's calls to email (review 51 🟡5).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Gmail being unreachable must not mark this container unhealthy (it would be restarted for nothing)
management.health.mail.enabled=false
