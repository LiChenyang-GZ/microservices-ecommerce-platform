# The whole system on one machine. From the repository root:
#   docker compose -f backend/compose.yml up -d --build --wait
# ${...} values come from backend/.env (copy backend/.env.example).
# Each service lists only the variables it needs, so a container never sees
# another service's password (no env_file on purpose).
name: shop

x-java-healthcheck: &java-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 120s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      # Read by docker/postgres/init/01-create-databases.sh on first start
      STORE_DB_PASSWORD: ${STORE_DB_PASSWORD:?set STORE_DB_PASSWORD in backend/.env}
      BANK_DB_PASSWORD: ${BANK_DB_PASSWORD:?set BANK_DB_PASSWORD in backend/.env}
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD:?set DELIVERY_DB_PASSWORD in backend/.env}
      EMAIL_DB_PASSWORD: ${EMAIL_DB_PASSWORD:?set EMAIL_DB_PASSWORD in backend/.env}
      TRACKING_DB_PASSWORD: ${TRACKING_DB_PASSWORD:?set TRACKING_DB_PASSWORD in backend/.env}
    ports:
      - '5433:5432' # host 5432 is taken by a locally installed PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 checks over TCP, which is how the other containers connect.
      # Without it pg_isready uses the Unix socket, and on the first start the
      # temporary init server answers on the socket only, so the container would
      # be reported healthy before the init script has created the databases.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in backend/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in backend/.env}
    ports:
      - '5672:5672'
      - '15672:15672' # management UI
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper): one process is both broker
  # and controller. Config and topic list: docs/wave2-config-contract.md
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:9092). EXTERNAL: this machine, for
      # services run with bootRun / go run (localhost:9094).
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker, so every internal topic can only have one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      # Topics come only from kafka-init. A typo in a topic name then fails at
      # once instead of silently creating a new, empty topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - '9094:9094'
    # No volume: `stop` keeps the data, `down` throws it away. Events are not
    # lost with it: they are still in each service's event_outbox in Postgres.
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Creates the topics, then exits. Safe to run again (--if-not-exists).
  # 3 partitions: one orderId always lands on the same partition (ordered),
  # different orders spread over three. Each .DLT has the same partition
  # count as its topic, because Spring sends a broken record to the DLT
  # partition with the same number it came from.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        for t in order-events delivery-events order-events.DLT delivery-events.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
    restart: 'no'

  store:
    build:
      context: .
      args:
        SERVICE: storeService
    image: shop-store
    ports:
      - '8082:8082'
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      STORE_DB_PASSWORD: ${STORE_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in backend/.env}
      # Inside the compose network, services reach each other by service name.
      STORE_SERVICE_URL: http://store:8082
      BANK_SERVICE_URL: http://bank:8084
      DELIVERY_SERVICE_URL: http://delivery:8081
      EMAIL_SERVICE_URL: http://email:8083
      # Wave 2 (docs/wave2-config-contract.md). Unused until the code reads them.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BANK_GRPC_ADDRESS: bank:9090
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *java-healthcheck
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8082/actuator/health']

  bank:
    build:
      context: .
      args:
        SERVICE: bankService
    image: shop-bank
    ports:
      - '8084:8084'
      - '9090:9090' # gRPC, for store; published so grpcurl can reach it
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      BANK_DB_PASSWORD: ${BANK_DB_PASSWORD}
      STORE_SERVICE_URL: http://store:8082
      BANK_GRPC_PORT: '9090'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8084/actuator/health']

  delivery:
    build:
      context: .
      args:
        SERVICE: deliveryService
    image: shop-delivery
    ports:
      - '8081:8081'
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      STORE_SERVICE_URL: http://store:8082
      STORE_AUTH_URL: http://store:8082/api/user/login
      EMAIL_SERVICE_URL: http://email:8083
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *java-healthcheck
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8081/actuator/health']

  email:
    build:
      context: .
      args:
        SERVICE: emailService
    image: shop-email
    ports:
      - '8083:8083'
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      EMAIL_DB_PASSWORD: ${EMAIL_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      STORE_SERVICE_URL: http://store:8082
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8083/actuator/health']

  # Go read service (ADR-11). Healthcheck is built into the image (Dockerfile).
  tracking:
    build: ./trackingService
    image: shop-tracking
    ports:
      - '8085:8085'
    environment:
      DATABASE_URL: postgres://tracking_user:${TRACKING_DB_PASSWORD}@postgres:5432/tracking_db?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP: tracking
      STORE_URL: http://store:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  frontend:
    build: ../frontend
    image: shop-frontend
    ports:
      # Must stay 3000: the backends only allow CORS from http://localhost:3000
      - '3000:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
