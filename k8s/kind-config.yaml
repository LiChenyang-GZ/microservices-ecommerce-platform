# The local cluster (ADR-13): one kind node, which is a Docker container.
#   kind create cluster --config k8s/kind-config.yaml
# Only port 80 is published, and only on 127.0.0.1. The ports compose already
# uses (3000, 808x, 5433, 9090, 9094) stay free, so both stacks can run at once.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shop
nodes:
  - role: control-plane
    # Pinned by digest, as the kind v0.33.0 release notes list it.
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    extraPortMappings:
      # The Envoy Gateway proxy listens on NodePort 30080 (gateway/gateway.yaml).
      # This maps it to http://localhost on this machine.
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1
        protocol: TCP
