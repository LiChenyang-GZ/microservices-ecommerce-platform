# RabbitMQ: delivery's job queue and dead letters, store -> email_queue (design figure 2).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: shop
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - { name: amqp, port: 5672 }
    - { name: management, port: 15672 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: shop
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      # No *_PORT / *_SERVICE_HOST variables for every Service in the namespace;
      # each pod gets exactly the variables listed here.
      enableServiceLinks: false
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          # RabbitMQ keeps its data under its node name, rabbit@<hostname>. A
          # StatefulSet pod is always called rabbitmq-0, so after a restart it
          # finds its old queues on the volume instead of starting as a new node.
          envFrom:
            - secretRef:
                name: rabbitmq
          ports:
            - containerPort: 5672
            - containerPort: 15672
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ['rabbitmq-diagnostics', '-q', 'check_port_connectivity']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ['rabbitmq-diagnostics', '-q', 'ping']
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi
