# bank: accounts and money. Only store calls it: REST 8084 (open account, account by
# email) and gRPC 9090 (transfer / refund, wave 2 B). Both need BANK_SERVICE_TOKEN (ADR-23);
# the entry routes no bank path (routes.yaml). The NetworkPolicy at the end limits 9090 to store.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bank
  namespace: shop
data:
  DB_HOST: postgres
  DB_PORT: '5432'
  STORE_SERVICE_URL: http://store:8082
  BANK_GRPC_PORT: '9090'
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: 'true'
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
---
apiVersion: v1
kind: Service
metadata:
  name: bank
  namespace: shop
spec:
  selector:
    app: bank
  ports:
    - { name: http, port: 8084 }
    - { name: grpc, port: 9090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank
  template:
    metadata:
      labels:
        app: bank
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-deps
          image: postgres:16-alpine
          command: ['sh', '-c']
          args:
            - until PGPASSWORD="$BANK_DB_PASSWORD" psql -h postgres -U bank_user -d bank_db -tAc 'select 1' >/dev/null 2>&1; do echo 'waiting for postgres/bank_db'; sleep 3; done
          env:
            - name: BANK_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bank, key: BANK_DB_PASSWORD } }
      containers:
        - name: bank
          image: shop-bank:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: bank }
            - secretRef: { name: bank }
          ports:
            - containerPort: 8084
            - containerPort: 9090
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            periodSeconds: 5
            failureThreshold: 48
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
---
# Second fence for the money calls (ADR-23): only store pods may open bank's gRPC port.
# The service token is the first fence; this one also stops a pod that somehow has the token.
# 8084 stays open to every pod: kubelet's probes use it, and every /api/bank/* call needs the token anyway.
# Enforced only if the cluster's network plugin implements NetworkPolicy: kind's default kindnet does
# since kind v0.24; a plugin without it silently ignores this object.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bank
  namespace: shop
spec:
  podSelector:
    matchLabels: { app: bank }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: store } }
      ports:
        - { protocol: TCP, port: 9090 }
    - ports:
        - { protocol: TCP, port: 8084 }
