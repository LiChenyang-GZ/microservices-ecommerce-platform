# tracking (Go, ADR-11): reads both topics, serves the order timeline.
# DATABASE_URL is in Secret "tracking" because the password is inside it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracking
  namespace: shop
data:
  KAFKA_BROKERS: kafka:9092
  KAFKA_GROUP: tracking
  STORE_URL: http://store:8082
---
apiVersion: v1
kind: Service
metadata:
  name: tracking
  namespace: shop
spec:
  selector:
    app: tracking
  ports:
    - { name: http, port: 8085 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracking
  template:
    metadata:
      labels:
        app: tracking
    spec:
      enableServiceLinks: false
      initContainers:
        # Wait for its database and the broker. The topics come from the
        # kafka-init Job; auto-create is off (contract).
        - name: wait-for-deps
          image: postgres:16-alpine
          command: ['sh', '-c']
          args:
            - until psql "$DATABASE_URL" -tAc 'select 1' >/dev/null 2>&1 && nc -z kafka 9092; do echo 'waiting for postgres/tracking_db and kafka'; sleep 3; done
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: tracking, key: DATABASE_URL } }
      containers:
        - name: tracking
          image: shop-tracking:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: tracking }
            - secretRef: { name: tracking }
          ports:
            - containerPort: 8085
          # /healthz: the process answers. /readyz: the database answers (not Kafka:
          # Kafka down only delays events, the same rule as the Java services).
          livenessProbe:
            httpGet: { path: /healthz, port: 8085 }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 8085 }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
