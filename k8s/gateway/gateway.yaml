# The single entry for the browser (ADR-13), built with Gateway API + Envoy Gateway.
# Why not an Ingress: ingress-nginx stopped receiving releases and security fixes
# in March 2026, and kind's own docs point to Gateway API. The routes (which path
# goes to which service) are in routes.yaml.
#
# Install Envoy Gateway first (its CRDs and controller), then apply this:
#   kubectl apply --server-side -f https://github.com/envoyproxy/gateway/releases/download/v1.9.2/install.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: shop
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: shop-proxy
    namespace: shop
---
# How Envoy Gateway runs the proxy pod for this class.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: shop-proxy
  namespace: shop
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      envoyService:
        # kind has no cloud load balancer, so a LoadBalancer Service would stay
        # <pending>. NodePort 30080 is mapped to localhost:80 in kind-config.yaml.
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop
  namespace: shop
spec:
  gatewayClassName: shop
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
